<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SmartFood</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            <span>♻</span>
            SmartFood
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="index.html#about">About</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="register-btn">Get Started</a>
        </div>

    </header>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-container">

            <div class="login-header">

                <div class="login-icon">
                    🔐
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to your SmartFood account
                </p>

            </div>


            <!-- Login Form -->
            <form class="login-form" onsubmit="loginUser(); return false;">

                <div class="form-group">

                    <label for="role">
                        Login As
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="provider">
                            Food Provider
                        </option>

                        <option value="recipient">
                            Recipient / NGO
                        </option>

                        <option value="admin">
                            Administrator
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="login-submit">
                    Login →
                </button>

            </form>


            <div class="register-link">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <div class="copyright">
            © 2026 Smart Food Waste Reduction and Surplus Food Management System
        </div>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
