<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SmartFood</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            <span>♻</span>
            SmartFood
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="index.html#about">About</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="register-btn">Get Started</a>
        </div>

    </header>


    <!-- Registration Section -->
    <section class="register-section">

        <div class="register-container">

            <div class="register-header">

                <div class="register-icon">
                    🌱
                </div>

                <h1>Create Your Account</h1>

                <p>
                    Join SmartFood and help reduce food waste
                </p>

            </div>


            <!-- Registration Form -->
            <form class="register-form" onsubmit="registerUser(); return false;">

                <div class="form-row">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="role">
                            Account Type
                        </label>

                        <select id="role" required>

                            <option value="">
                                Select account type
                            </option>

                            <option value="provider">
                                Food Provider
                            </option>

                            <option value="recipient">
                                Recipient / NGO
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Exact Location -->
                <div class="form-group">

                    <label for="location">
                        Exact Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter your exact location"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <label class="terms">

                    <input type="checkbox" required>

                    <span>
                        I agree to the SmartFood terms and conditions.
                    </span>

                </label>


                <button type="submit" class="register-submit">
                    Create Account →
                </button>

            </form>


            <div class="login-link">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login here
                    </a>
                </p>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <div class="copyright">
            © 2026 Smart Food Waste Reduction and Surplus Food Management System
        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
